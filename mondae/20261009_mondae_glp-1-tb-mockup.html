<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mondae | GLP-1-tb (mockup)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Sans:opsz,wght@12..24,400;12..24,700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet" />
  <style>
    :root {
      --stone-50: #fafaf9;
      --stone-100: #f5f5f4;
      --stone-200: #e5e5e5;
      --stone-500: #737373;
      --stone-600: #525252;
      --stone-900: #171717;
      --yellow: #fff1b5;
      --cream: #fffdf3;
      --serif: "Hedvig Letters Serif", Georgia, serif;
      --sans: "Hedvig Letters Sans", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--stone-50);
      color: var(--stone-900);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    .note {
      background: #171717;
      color: #fff;
      font-size: 13px;
      text-align: center;
      padding: 8px 16px;
    }
    .note strong { font-weight: 700; }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--stone-200);
    }
    .logo svg { display: block; height: 11px; width: auto; }
    .nav-cta {
      background: var(--stone-900);
      color: #fafafa;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 12px;
    }

    .hero {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      display: grid;
      gap: 16px;
    }
    @media (min-width: 960px) {
      .hero {
        grid-template-columns: 5fr 7fr;
        gap: 24px;
        padding: 24px 24px 64px;
        align-items: stretch;
      }
    }

    .media {
      background: var(--stone-100);
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 33 / 20;
    }
    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (min-width: 960px) {
      .media { aspect-ratio: auto; position: relative; }
      .media img { position: absolute; inset: 0; }
    }

    .card {
      background: var(--cream);
      border: 1px solid var(--stone-200);
      border-radius: 16px;
      padding: 24px 20px 28px;
    }
    @media (min-width: 640px) {
      .card { padding: 32px; }
    }

    .pay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 18px;
    }
    .pay img { height: 26px; width: auto; }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(36px, 5vw, 52px);
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-align: center;
    }
    .sub {
      margin: 12px 0 0;
      text-align: center;
      color: var(--stone-600);
      font-size: 16px;
    }

    .pricing {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--stone-200);
    }
    .table-wrap {
      overflow: hidden;
      border: 1px solid var(--stone-200);
      border-radius: 4px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead { background: var(--yellow); }
    th {
      padding: 12px 16px;
      font-weight: 400;
      text-align: left;
    }
    th.amt, td.amt { text-align: center; }
    tbody th { white-space: nowrap; }
    @media (max-width: 480px) {
      th, tbody th, tbody td { padding-left: 12px; padding-right: 12px; }
    }
    td.amt {
      font-family: var(--serif);
      font-size: 16px;
      color: var(--stone-900);
    }
    tbody th {
      color: var(--stone-500);
      font-weight: 400;
    }
    tbody tr { border-top: 1px solid var(--stone-200); }
    tbody th, tbody td { padding: 12px 16px; }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      background: var(--stone-900);
      color: #fafafa;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 14px;
    }
    .checks {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }
    .checks li {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--stone-600);
      font-size: 14px;
    }
    .checks svg { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
